# BiciPRO — manifiesto Flathub (compila desde el código). Desarrollada por Javiera Navarrete.
app-id: io.github.navarretenoir.BiciPRO
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: bicipro
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: bicipro
    buildsystem: simple
    build-commands:
      - make -C desktop UI_DIR=/app/share/bicipro/web
      - install -Dm755 desktop/bicipro /app/bin/bicipro
      - mkdir -p /app/share/bicipro && cp -r web /app/share/bicipro/ && rm -f /app/share/bicipro/web/*.bak*
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/bicipro.git
        tag: v1.0.2
        commit: 8ba33e577421d66b1d970b1634786b5db173482b
