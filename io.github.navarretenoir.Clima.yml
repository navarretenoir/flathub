# clima — manifiesto Flathub (compila desde el código). Desarrollado por Javiera Navarrete.
app-id: io.github.navarretenoir.Clima
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: clima-app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --system-talk-name=org.freedesktop.GeoClue2
modules:
  - name: clima
    buildsystem: simple
    build-commands:
      - |
        make -C c clima suspension-scraper restriccion-scraper ROOT=/app/share/clima VERSION=$(cat VERSION) \
          EXTRA_CFLAGS="-DCLIMA_LIBEXEC='\"/app/libexec/clima\"'"
      - install -Dm755 c/clima /app/bin/clima
      - install -Dm755 c/suspension-scraper /app/libexec/clima/suspension-scraper
      - install -Dm755 c/restriccion-scraper /app/libexec/clima/restriccion-scraper
      - mkdir -p /app/share/clima && cp -r ui data /app/share/clima/
      - |
        printf '#!/bin/sh\n: "${CLIMA_HWACCEL:=never}"; export CLIMA_HWACCEL\nexec /app/bin/clima --gui "$@"\n' > /app/bin/clima-app
        chmod 755 /app/bin/clima-app
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/clima.git
        tag: v1.2.1
        commit: ea7c2267e664a6dbc0e15eeb5aba20bfd1b35151
