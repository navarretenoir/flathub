# Regla de 3 — manifiesto Flathub (compila desde el código). Desarrollada por Javiera Navarrete.
app-id: io.github.navarretenoir.ReglaDe3
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: regla-de-3
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: regla-de-3
    buildsystem: simple
    build-commands:
      - make -C desktop UI_DIR=/app/share/regla-de-3/ui
      - install -Dm755 desktop/regla-de-3 /app/bin/regla-de-3
      - mkdir -p /app/share/regla-de-3 && cp -r ui /app/share/regla-de-3/ && rm -f /app/share/regla-de-3/ui/*.bak*
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/reglade3.git
        tag: v1.0
        commit: 90124e03b44f7747efada3a799c13c03fba9d590
