# metrochile — manifiesto Flathub (compila desde el código). Desarrollado por Javiera Navarrete.
app-id: io.github.navarretenoir.MetroChile
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: metro-chile
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: metrochile
    buildsystem: simple
    build-commands:
      - make -C desktop ROOT=/app/share/metro-chile
      - install -Dm755 desktop/metro-app /app/bin/metro-chile
      - mkdir -p /app/share/metro-chile && cp -r ui /app/share/metro-chile/
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/metrochile.git
        tag: v2.2.1
        commit: f9f350bfb35aee81bc22dc84d44af3492d1ce256
