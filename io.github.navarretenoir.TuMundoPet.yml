# tumundopet — manifiesto Flathub (compila desde el código). Desarrollado por Javiera Navarrete.
app-id: io.github.navarretenoir.TuMundoPet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tumundopet
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: tumundopet
    buildsystem: simple
    build-commands:
      - make -C desktop
      - install -Dm755 desktop/tumundopet /app/bin/tumundopet
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/tumundopet.git
        tag: v1.1.1
        commit: e9d1a08284c5772c5891597c22f3b38e7906b635
